version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/ishi-o/go_demo/hertz_demo/biz/model/api
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
plugins:
  - remote: buf.build/protocolbuffers/go
    out: biz/model/api
    opt:
      - paths=source_relative
