global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "hertz_demo"
    static_configs:
      - targets: ["hertz_demo:8081"]
    metrics_path: "/metrics"

  - job_name: "envoy"
    static_configs:
      - targets: ["envoy_gateway:9901"]
    metrics_path: "/stats/prometheus"
